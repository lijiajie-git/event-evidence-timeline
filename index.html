<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件证据时间线</title>
<meta name="description" content="同一件事在公告和报道里怎么变的：最早怎么说，后来改了什么，现在算数的是哪一版。">
<link rel="stylesheet" href="web/stage.css?v=dev">
</head>
<body>
<header class="bar">
  <b>事件证据时间线</b>
  <nav>
    <a href="workbench.html">工作台</a>
    <a href="https://github.com/lijiajie-git/event-evidence-timeline" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-l">
      <h1>你看到的那条消息，<br>现在还算数吗？</h1>
      <p id="hero-sub">同一件事会被公告、快讯、评论反复说，数字还会被公司自己改。</p>
      <a class="go" href="#demo">看它怎么解决 ↓</a>
    </div>
    <div class="hero-r" id="hero-table"></div>
  </section>

  <section class="stage" id="demo">
    <div id="stage" class="st-grid">
      <div class="dev-col">
        <div class="ipad-box" id="ipad-box">
          <div class="ipad" id="ipad"><div class="screen"><iframe id="ipad-frame" src="workbench.html?embed" title="工作台"></iframe></div></div>
        </div>
      </div>
      <aside class="ai" aria-live="polite">
        <p class="ch" id="ch"></p>
        <h2 id="ai-title"></h2>
        <dl class="three" id="three"></dl>
        <p class="hint" id="hint"></p>
      </aside>
    </div>
    <div class="rail">
      <div class="prog"><i id="prog"></i></div>
      <div class="rail-row">
        <span class="cur" id="ch-name"></span>
        <span class="sp"></span>
        <button id="prev" type="button">上一段</button>
        <button id="next" type="button">下一段</button>
        <button id="play" type="button">暂停</button>
      </div>
    </div>
  </section>

  <section class="sec" id="highlights">
    <h2>怎么做出来的</h2>
    <p class="lede">模型只做读不懂就做不准的那一步，其余都是规则。</p>
    <ol class="flow" id="flow"></ol>
    <details class="more"><summary>看逐条核查记录</summary><div id="audit-body"></div></details>
  </section>

  <section class="sec" id="eval">
    <h2>抽得准不准</h2>
    <div id="eval-body"><p class="lede">读取中…</p></div>
  </section>

  <section class="sec" id="ai">
    <h2>我怎么用 AI 做的</h2>
    <div id="ai-body"><p class="lede">读取中…</p></div>
  </section>
</main>

<footer class="end">
  <p>标准答案是另一个模型独立标注的，不是人工标注。</p>
  <p>网页不实时调用模型，问答是离线生成的。</p>
  <p>只整理公开信息，不构成投资建议。</p>
  <p class="links"><a href="workbench.html">工作台</a><a href="https://github.com/lijiajie-git/event-evidence-timeline" target="_blank" rel="noopener">GitHub</a><button id="theme" type="button"></button></p>
</footer>
<noscript><p style="padding:20px">这个页面需要 JavaScript 才能读取数据文件。</p></noscript>
<!-- 版本号：仓库里是 v=dev，发布时由 .github/workflows/pages.yml 换成提交号，浏览器就不会拿旧脚本配新页面。
     模块之间的 import 也走这张表，所以被引用的模块同样带版本号。 -->
<script type="importmap">{"imports": {
  "./web/core.js": "./web/core.js?v=dev",
  "./web/verify.js": "./web/verify.js?v=dev",
  "./web/source.js": "./web/source.js?v=dev",
  "./web/sections.js": "./web/sections.js?v=dev"
}}</script>
<script type="module" src="web/stage.js?v=dev"></script>
</body>
</html>
