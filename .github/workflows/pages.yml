# 发布到 GitHub Pages。线上地址不变：https://lijiajie-git.github.io/event-evidence-timeline/
# 页面是纯静态的，不需要构建；这里只做一件事：把 HTML 里引用脚本和样式的 v=dev 换成本次提交号，
# 这样每次改动后浏览器都会取新文件，不会出现旧脚本配新页面。
name: 发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 给脚本和样式打上版本号
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i "s/?v=dev/?v=$V/g" index.html workbench.html
          echo "版本 $V"
          ! grep -n "?v=dev" index.html workbench.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
