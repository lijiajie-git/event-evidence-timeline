<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件证据时间线</title>
<style>
:root{--bg:#f7f6f2;--ink:#1c1b19;--mute:#6b6862;--line:#d9d6ce;--card:#fffefb;--acc:#8a3b12;--warn:#9a6a00}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--ink:#e9e6df;--mute:#9a968d;--line:#34322e;--card:#1d1c1a;--acc:#e0935f;--warn:#d6a53a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Songti SC","Noto Serif SC",Georgia,serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:24px;margin:0 0 4px;font-weight:600}
h2{font-size:15px;margin:36px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ink);font-weight:600;letter-spacing:.04em}
.sub,.meta,small{color:var(--mute);font:13px/1.6 -apple-system,"PingFang SC",sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0;font-family:-apple-system,"PingFang SC",sans-serif}
select{font:inherit;padding:6px 8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:2px;max-width:100%}
.status{font-family:-apple-system,"PingFang SC",sans-serif;font-size:13px;border:1px solid var(--ink);padding:1px 8px;margin-left:8px;white-space:nowrap}
p{margin:6px 0}
.ref{font:12px ui-monospace,Menlo,monospace;color:var(--acc);cursor:pointer;margin-left:4px;text-decoration:underline dotted}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums}
.old{color:var(--mute)}
.ev{border-left:2px solid var(--line);padding:2px 0 14px 14px;margin-left:4px}
.ev.hl{border-left-color:var(--acc);background:var(--card)}
.ev .t{font-weight:600}
.k{font:12px -apple-system,"PingFang SC",sans-serif;border:1px solid var(--mute);padding:0 6px;margin-right:6px}
.k.事实{border-style:solid;border-color:var(--ink)}.k.观点{border-style:double;border-width:3px}.k.推测{border-style:dashed}.k.传闻{border-style:dotted}
blockquote{margin:6px 0;padding-left:10px;border-left:2px solid var(--acc);color:var(--mute);font-size:14px}
.warn{border:1px solid var(--warn);padding:10px 12px;margin:8px 0;background:var(--card)}
a{color:var(--acc)}
ul{margin:4px 0;padding-left:20px}
#err{border:1px solid var(--acc);padding:14px;margin-top:20px;display:none}
</style>
</head>
<body>
<main>
<h1>事件证据时间线</h1>
<div class="sub">同一件事在公告和报道里怎么变的：最早怎么说，后来改了什么，现在算数的是哪一版。<span id="disc"></span></div>
<div id="err"></div>
<div class="bar">
  <label>事件 <select id="selE"></select></label>
  <label>截至 <select id="selD"></select></label>
</div>
<div id="app"></div>
<p class="meta" style="margin-top:48px">这是先上线的简版页面，正式界面在做。大模型离线抽取，结果经引用逐字校验后写入 data/events.json，网页只读这份文件：GitHub Pages 是纯静态站，没有地方安全存放模型密钥，所以不做实时调用。<a href="https://github.com/lijiajie-git/event-evidence-timeline">源代码与说明</a></p>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA, E, asOf;
const fmt=v=>v==null?'未确定':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2});
const range=v=>v.low==null?'未确定':(v.low===v.high?fmt(v.low):fmt(v.low)+' 至 '+fmt(v.high));
const refs=ids=>(ids||[]).map(i=>`<span class="ref" data-e="${i}">${i}</span>`).join('');
fetch('data/events.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
  DATA=d; $('#disc').textContent=' '+d.disclaimer;
  $('#selE').innerHTML=d.events.map((e,i)=>`<option value="${i}">${esc(e.name)}｜${esc(e.title)}</option>`).join('');
  $('#selE').onchange=()=>pick(+$('#selE').value); $('#selD').onchange=()=>{asOf=$('#selD').value;render()};
  pick(0);
}).catch(e=>{$('#err').style.display='block';$('#err').innerHTML='数据没有加载成功（'+esc(e.message)+'）。页面不会显示任何结论，请稍后刷新，或到仓库查看 data/events.json。'});
function pick(i){E=DATA.events[i];const ds=E.conclusions.map(c=>c.as_of);
  $('#selD').innerHTML=ds.map((d,n)=>`<option value="${d}">${d}${n==ds.length-1?'（最新）':''}</option>`).join('');asOf=ds[ds.length-1];$('#selD').value=asOf;render()}
function render(){
  const ev=E.evidence.filter(x=>x.times.disclosed<=asOf), byId=Object.fromEntries(E.evidence.map(x=>[x.id,x]));
  const st=[...E.status_history].filter(s=>s.at<=asOf).pop(), con=[...E.conclusions].filter(c=>c.as_of<=asOf).pop();
  let h=`<h2>${esc(E.name)} ${esc(E.code)}｜${esc(E.title)}<span class="status">${esc(st?st.status:'无记录')}</span></h2>
  <p class="meta">为什么算同一件事：${esc(E.merge_reason)}</p>
  <p class="meta">所指期间：${esc(E.occurred.start)} 至 ${esc(E.occurred.end)}（${esc(E.occurred.note||'')}）　状态自 ${st?st.at:'—'} 起</p>`;
  h+=`<h2>截至 ${asOf} 的结论</h2>`;
  if(con){h+='<p><b>事实</b></p><ul>'+con.facts.map(f=>`<li>${esc(f.text)}${refs(f.evidence_ids)}</li>`).join('')+'</ul>';
    if((con.inferences||[]).length)h+='<p><b>推断</b></p><ul>'+con.inferences.map(f=>`<li>${esc(f.text)}${refs(f.evidence_ids)}</li>`).join('')+'</ul>';
    if((con.unknowns||[]).length)h+='<p><b>还不确定</b></p><ul>'+con.unknowns.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>';}
  else h+='<p>这个时点还没有结论。</p>';
  const cf=(E.conflicts||[]).filter(c=>c.first_seen<=asOf);
  if(cf.length){h+='<h2>证据冲突</h2>'+cf.map(c=>`<div class="warn"><b>${esc(c.kind)}</b>　${esc(c.text)}${c.quotes.map(q=>`<blockquote>${esc(q.quote)}${refs([q.evidence_id])}</blockquote>`).join('')}<p class="meta">怎么处理（${esc(c.resolved_by||'未处理')}）：${esc(c.resolution)}</p></div>`).join('')}
  if((E.claims||[]).length){
    h+='<h2>数字的各个版本</h2><div class="tblwrap"><table><tr><th>指标</th><th>版本</th><th>数值</th><th>口径</th><th>生效</th><th>现状</th><th>出处</th></tr>';
    E.claims.forEach(c=>{const vs=c.versions.filter(v=>v.valid_from<=asOf);vs.forEach((v,n)=>{const cur=n==vs.length-1;
      h+=`<tr class="${cur?'':'old'}"><td>${n?'':esc(c.key)}</td><td>第 ${v.v} 版</td><td class="num">${range(v)} ${v.low==null?'':esc(v.unit||'')}</td><td>${esc(v.basis||'未注明')}</td><td>${v.valid_from}</td><td>${cur?(v.status=='void'&&(v.void_from||'')<=asOf?'已作废，交易终止':'当前有效'):'前值，'+vs[n+1].valid_from+' 被 '+vs[n+1].evidence_id+' 取代'}</td><td>${refs([v.evidence_id])}</td></tr>`;
      if(v.note)h+=`<tr class="old"><td></td><td colspan="6" style="white-space:normal">注：${esc(v.note)}</td></tr>`})});
    h+='</table></div>'}
  h+='<h2>证据时间线</h2>'+ev.map(x=>{const t=x.times,od=x.outdated_by&&byId[x.outdated_by].times.disclosed<=asOf;
    return `<div class="ev" id="ev-${x.id}"><div class="meta">${esc(t.published_at)}（精确到${esc(t.precision)}）　${esc(x.source)}　<span class="ref">${x.id}</span></div>
    <div class="t"><span class="k ${esc(x.kind)}">${esc(x.kind)}</span>${esc(x.title)}</div>
    <p>${esc(x.summary||'未抽取摘要')}</p>${x.quote?`<blockquote>原文：${esc(x.quote)}</blockquote>`:'<p class="meta">原文片段：未抽取</p>'}
    ${od?`<p class="meta" style="color:var(--warn)">这条观点的前提已被 ${x.outdated_by} 推翻：${esc(x.outdated_note||'')}</p>`:''}
    <div class="meta">${esc(x.relation.type)}${x.relation.target?' '+x.relation.target:''}　来源级别 ${esc(x.source_tier)}（${esc(x.tier_note)}，权重 ${x.weight}）　发生：${t.occurred.date||(t.occurred.start+' 至 '+t.occurred.end)}　抓取：${esc((t.fetched||'').slice(0,16))} UTC　更新：${t.updated||'来源未提供'}　<a href="${esc(x.url)}" target="_blank" rel="noopener">看原文</a></div></div>`}).join('');
  h+='<h2>披露前后的股价</h2>';const p=E.prices||{};
  if(p.error||!(p.bars||[]).length)h+=`<div class="warn">行情不可用：${esc(p.error||'无数据')}。这里不显示任何价格。</div>`;
  else{const mk={};p.markers.forEach(m=>{if(m.disclosed<=asOf)(mk[m.first_trading_day]=mk[m.first_trading_day]||[]).push(m.evidence_id)});
    h+=`<p class="meta">${esc(p.source)}，${esc(p.adjust)}，${esc(p.note)}。只陈列事实，不代表因果。</p><div class="tblwrap"><table><tr><th>交易日</th><th>收盘（元）</th><th>涨跌幅</th><th>成交额（元）</th><th>当日对应的披露</th></tr>`+
    p.bars.filter(b=>b.date<=asOf||true).filter(b=>b.date<=nextDay(asOf,p.bars)).map(b=>`<tr><td>${b.date}</td><td class="num">${b.close}</td><td class="num">${b.pct==null?'—':b.pct+'%'}</td><td class="num">${b.turnover?Math.round(b.turnover).toLocaleString('zh-CN'):'—'}</td><td>${refs(mk[b.date])}</td></tr>`).join('')+'</table></div>'}
  if((E.pending||[]).length)h+='<h2>没做到的</h2><ul>'+E.pending.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>';
  $('#app').innerHTML=h;
  document.querySelectorAll('.ref[data-e]').forEach(a=>a.onclick=()=>{const el=document.getElementById('ev-'+a.dataset.e);if(!el)return;document.querySelectorAll('.ev.hl').forEach(e=>e.classList.remove('hl'));el.classList.add('hl');el.scrollIntoView({behavior:'smooth',block:'center'})});
}
function nextDay(d,bars){const later=bars.filter(b=>b.date>d).slice(0,3);return later.length?later[later.length-1].date:d}
</script>
</body>
</html>
